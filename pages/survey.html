
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高校生 世論調査</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>今月の質問</h1>
<p id="question">読み込み中...</p>

<!-- はい・いいえの回答ボタン -->
<button onclick="submitAnswer('はい')">はい</button>
<button onclick="submitAnswer('いいえ')">いいえ</button>

<br><br>

<!-- 回答理由 -->
<label for="reason">回答した理由（任意）</label>
<br>
<textarea
  id="reason"
  placeholder="理由を自由に記入してください..."
  rows="4"
  maxlength="500"
  style="width:100%; max-width:500px; margin:10px 0;"
></textarea>

<br>

<button onclick="submitReason()">理由を送信</button>

<hr>

<h2>結果</h2>
<canvas id="chart"></canvas>

<hr>

<h2>質問を投稿</h2>

<input id="newQuestion" placeholder="新しい質問">
<button onclick="submitQuestion()">投稿</button>

<script type="module" src="./surveyscript.js"></script>

</body>
</html>
